<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hors ligne · Super Morpion</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f4efe6;
        color: #1f1d19;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        padding: 16px;
        box-sizing: border-box;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #171614; color: #efece6; }
      }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 20px; margin: 16px 0 6px; }
      p { margin: 0 0 18px; opacity: 0.75; font-size: 14px; }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 10px;
        padding: 10px 18px;
        background: #1f1d19;
        color: #fbf9f4;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Tu es hors ligne</h1>
      <p>Super Morpion se joue en ligne. Reviens dès que le réseau est de retour.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>

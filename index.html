    <script>
      (function () {
        try {
          var saved = localStorage.getItem('sm_theme');
          if (
            saved === 'atelier' ||
            saved === 'argile' ||
            saved === 'bordeaux' ||
            saved === 'travertin' ||
            saved === 'kyoto' ||
            saved === 'nocturne' ||
            saved === 'emeraude' ||
            saved === 'obsidienne' ||
            saved === 'ebene'
          ) {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {}
